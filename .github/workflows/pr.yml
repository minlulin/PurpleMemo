# The cheap, language-only checks, so a reviewer sees whether a pull request
# passes them without waiting for the author's machine. This is NOT the gate:
# the full `npm run verify` (Rust tests, clippy, fmt, the frontend build) still
# runs in the pre-push hook on the author's clone, and the release stays
# hand-built (README, "Local gate"). It runs on pull_request only: a push to a
# branch has the same evidence from the same command, and every extra run
# spends the owner's Actions minutes.
name: PR checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: node scripts/check-references.mjs
      - run: npm test
