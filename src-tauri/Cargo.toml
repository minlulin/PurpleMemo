[package]
name = "purple-memo"
version = "0.1.0"
description = "Personal offline notebook and life/money manager"
authors = ["minlulin"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "purple_memo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-updater = "2.13.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
