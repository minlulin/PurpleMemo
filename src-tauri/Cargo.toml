[package]
name = "purple-memo"
version = "0.1.0"
description = "Personal offline notebook and life/money manager"
authors = ["minlulin"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "purple_memo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
tauri-plugin-updater = "2.13.3"
tauri-plugin-notification = "2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring = "4.2.0"
sha2 = "0.11.0"
getrandom = "0.4.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
